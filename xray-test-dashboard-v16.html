<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Xray Test Execution Dashboard v16 – Raven Step Evidence
    </title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script
      src="env.js"
      onerror="
        console.info('[xray-dashboard] env.js not found — manual config mode.')
      "
    ></script>
    <style>
      /* ========== STYLES ========== */
      :root {
        --bg: #08090d;
        --surface: #0f1117;
        --surface2: #161820;
        --border: #1e2130;
        --border2: #262a3a;
        --pass: #00e5a0;
        --fail: #ff4d6a;
        --skip: #ffa93d;
        --info: #4d9fff;
        --blocked: #b44dff;
        --text: #e8eaf2;
        --text2: #8b90a8;
        --text3: #545870;
        --accent: #00e5a0;
        --card-glow-pass: rgba(0, 229, 160, 0.06);
        --card-glow-fail: rgba(255, 77, 106, 0.06);
      }
      /* Base styles */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'DM Sans', sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        min-height: 100vh;
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 0;
        border-bottom: 1px solid var(--border);
        margin-bottom: 30px;
      }
      .logo {
        font-family: 'Space Mono', monospace;
        font-size: 20px;
        font-weight: 700;
        color: var(--accent);
      }
      .version-badge {
        font-size: 11px;
        padding: 4px 10px;
        background: rgba(0, 229, 160, 0.1);
        border: 1px solid rgba(0, 229, 160, 0.2);
        border-radius: 12px;
        color: var(--accent);
        font-family: 'Space Mono', monospace;
      }
      .tabs {
        display: flex;
        gap: 5px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 30px;
        overflow-x: auto;
      }
      .tab {
        padding: 12px 20px;
        background: none;
        border: none;
        color: var(--text2);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        transition: all 0.2s;
        white-space: nowrap;
      }
      .tab:hover {
        color: var(--text);
        border-bottom-color: var(--text3);
      }
      .tab.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 20px;
      }
      .card-header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .card-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card-body {
        padding: 20px;
      }
      .btn {
        padding: 8px 16px;
        border: 1px solid var(--border2);
        border-radius: 6px;
        background: var(--surface2);
        color: var(--text);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn:hover {
        border-color: var(--text3);
        background: var(--surface);
      }
      .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #000;
        font-weight: 600;
      }
      .btn-primary:hover {
        opacity: 0.9;
      }
      .btn-secondary {
        background: var(--surface2);
        border-color: var(--border2);
      }
      .config-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 16px;
        margin-bottom: 20px;
      }
      .config-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      label {
        font-size: 11px;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 600;
      }
      .input {
        background: var(--surface2);
        border: 1px solid var(--border2);
        border-radius: 6px;
        color: var(--text);
        font-size: 13px;
        padding: 8px 12px;
        outline: none;
        transition: border-color 0.2s;
      }
      .input:focus {
        border-color: var(--accent);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      thead tr {
        border-bottom: 1px solid var(--border2);
      }
      th {
        padding: 10px 12px;
        text-align: left;
        font-size: 11px;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 600;
        cursor: pointer;
      }
      th:hover {
        color: var(--text2);
      }
      td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
      }
      tr:hover {
        background: rgba(255, 255, 255, 0.02);
      }
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
      }
      .status-badge.pass { background: var(--card-glow-pass); border: 1px solid rgba(0, 229, 160, 0.2); color: var(--pass); }
      .status-badge.fail { background: var(--card-glow-fail); border: 1px solid rgba(255, 77, 106, 0.2); color: var(--fail); }
      .status-badge.skip { background: rgba(255, 169, 61, 0.08); border: 1px solid rgba(255, 169, 61, 0.2); color: var(--skip); }
      .status-badge.todo { background: rgba(77, 159, 255, 0.08); border: 1px solid rgba(77, 159, 255, 0.2); color: var(--info); }
      .status-badge.blocked { background: rgba(180, 77, 255, 0.08); border: 1px solid rgba(180, 77, 255, 0.2); color: var(--blocked); }
      .test-key {
        font-family: 'Space Mono', monospace;
        font-size: 12px;
        color: var(--info);
        text-decoration: none;
        font-weight: 600;
      }
      .test-key:hover {
        text-decoration: underline;
      }
      .step-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .step-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        font-size: 12px;
        padding: 8px 10px;
        background: var(--surface);
        border-radius: 6px;
        border: 1px solid var(--border);
      }
      .step-num {
        font-family: 'Space Mono', monospace;
        font-size: 10px;
        color: var(--text3);
        min-width: 22px;
        padding-top: 1px;
      }
      .step-desc {
        flex: 1;
        color: var(--text2);
        line-height: 1.5;
      }
      .step-comment {
        font-size: 11px;
        color: var(--text3);
        margin-top: 3px;
        font-style: italic;
      }
      .step-duration {
        font-size: 11px;
        color: var(--text3);
        font-family: 'Space Mono', monospace;
        min-width: 80px;
        text-align: right;
        padding-top: 2px;
      }
      .step-evidence {
        margin-top: 6px;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .evidence-link {
        font-size: 11px;
        color: var(--info);
        text-decoration: none;
        padding: 2px 6px;
        background: rgba(77, 171, 255, 0.08);
        border: 1px solid rgba(77, 171, 255, 0.2);
        border-radius: 3px;
      }
      .evidence-link:hover {
        background: rgba(77, 171, 255, 0.15);
      }
      .error-block {
        background: rgba(255, 77, 106, 0.06);
        border: 1px solid rgba(255, 77, 106, 0.15);
        border-radius: 6px;
        padding: 12px;
      }
      .error-label {
        font-size: 10px;
        color: var(--fail);
        font-family: 'Space Mono', monospace;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .error-text {
        font-family: 'Space Mono', monospace;
        font-size: 11px;
        color: #ff8095;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 120px;
        overflow-y: auto;
      }
      .empty-state {
        text-align: center;
        padding: 40px 20px;
      }
      .empty-icon {
        font-size: 48px;
        margin-bottom: 10px;
      }
      .empty-title {
        font-size: 16px;
        color: var(--text2);
        margin-bottom: 5px;
      }
      .meta-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .meta-item {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .meta-k {
        font-size: 10px;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .meta-v {
        font-size: 13px;
        color: var(--text);
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo">XRAY DASHBOARD</div>
        <div class="version-badge">v16 – Raven Step Evidence</div>
      </header>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('overview', this)">Overview</button>
        <button class="tab" onclick="switchTab('testExec', this)">Test Executions</button>
        <button class="tab" onclick="switchTab('failures', this)">Failures</button>
        <button class="tab" onclick="switchTab('environments', this)">Environments</button>
        <button class="tab" onclick="switchTab('trends', this)">Trends</button>
        <button class="tab" onclick="switchTab('compare', this)">Compare Releases</button>
        <button class="tab" onclick="switchTab('labels', this)">Label Analytics</button>
        <button class="tab" onclick="switchTab('api', this)">API Setup</button>
      </div>

      <!-- Overview Tab -->
      <div id="tab-overview" class="tab-content">
        <div class="card">
          <div class="card-header">
            <div class="card-title">📊 Configuration</div>
          </div>
          <div class="card-body">
            <div class="config-grid">
              <div class="config-group">
                <label>Jira URL</label>
                <input class="input" id="jiraUrl" placeholder="https://your-org.atlassian.net" />
              </div>
              <div class="config-group">
                <label>Project Key</label>
                <input class="input" id="projectKey" placeholder="PROJ" />
              </div>
              <div class="config-group">
                <label>Fix Version</label>
                <input class="input" id="fixVersion" placeholder="Release 14.2 eBus" />
              </div>
              <div class="config-group">
                <label>Start Date</label>
                <input class="input" id="startDate" type="date" />
              </div>
              <div class="config-group">
                <label>End Date</label>
                <input class="input" id="endDate" type="date" />
              </div>
              <div class="config-group">
                <label>Xray Type</label>
                <select class="input" id="xrayType">
                  <option value="cloud">Cloud</option>
                  <option value="server">Server/DC</option>
                </select>
              </div>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
              <div class="config-group">
                <label> </label>
                <button class="btn btn-secondary" onclick="autoDetectRelease()">
                  🔍 Auto Detect Release
                </button>
              </div>
              <div class="config-group">
                <label> </label>
                <button class="btn btn-primary" id="fetchExecBtn" onclick="triggerFetch()">
                  ⚡ Fetch Executions
                </button>
              </div>
              <button class="btn btn-secondary" id="autoFetchBtn" onclick="startAutoFetch()">
                ▶ Auto‑fetch all executions
              </button>
              <button class="btn btn-secondary" id="pauseFetchBtn" style="display:none" onclick="togglePauseFetch()">
                ⏸ Pause
              </button>
              <button class="btn btn-secondary" id="cancelFetchBtn" style="display:none" onclick="cancelFetch()">
                ✕ Cancel
              </button>
              <span id="autoFetchEta" style="font-size:11px;color:var(--text3);margin-left:8px"></span>
              <div class="config-group">
                <label> </label>
                <button class="btn btn-secondary" onclick="clearDateFilters()">
                  🗑 Clear Dates
                </button>
              </div>
              <div class="config-group">
                <label> </label>
                <button class="btn btn-secondary" onclick="loadMockData()">
                  🎭 Load Demo Data
                </button>
              </div>
              <div class="config-group">
                <label> </label>
                <button class="btn btn-secondary" onclick="clearAllData()">
                  🗑 Clear All Data
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title">📈 Metrics</div>
            <div id="topFixVersion" style="font-size:12px;color:var(--text3)">fixVersion: —</div>
          </div>
          <div class="card-body">
            <div id="metricsGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px"></div>
          </div>
        </div>

        <div id="overviewTestTable"></div>
      </div>

      <!-- Test Executions Tab -->
      <div id="tab-testExec" class="tab-content" style="display:none">
        <div class="card">
          <div class="card-header">
            <div class="card-title">🧪 Test Executions</div>
            <div id="execStats" style="font-size:12px;color:var(--text3)"></div>
          </div>
          <div class="card-body">
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
              <input class="input" id="execSearch" placeholder="🔍 Search tests..." style="flex:1;min-width:200px" oninput="renderMainTable()" />
              <select class="input" id="statusFilter" style="min-width:120px" onchange="renderMainTable()">
                <option value="all">All Statuses</option>
                <option value="PASS">Pass</option>
                <option value="FAIL">Fail</option>
                <option value="SKIP">Skip</option>
              </select>
              <select class="input" id="envFilter" style="min-width:120px" onchange="renderMainTable()">
                <option value="all">All Environments</option>
              </select>
              <select class="input" id="labelFilter" style="min-width:120px" onchange="renderMainTable()">
                <option value="all">All Labels</option>
                <option value="automation">Automation</option>
                <option value="manual">Manual</option>
              </select>
              <button class="btn btn-secondary" onclick="clearExecFilters()">Clear Filters</button>
            </div>
            <table>
              <thead>
                <tr>
                  <th onclick="sortTable('key')">TEST KEY</th>
                  <th onclick="sortTable('summary')">SUMMARY</th>
                  <th onclick="sortTable('status')">STATUS</th>
                  <th onclick="sortTable('environment')">ENV</th>
                  <th onclick="sortTable('browser')">BROWSER</th>
                  <th onclick="sortTable('assignee')">ASSIGNEE</th>
                  <th onclick="sortTable('started')">STARTED</th>
                  <th onclick="sortTable('duration')">DURATION</th>

            <div id="mainPagination" style="margin-top:16px;display:flex;align-items:center;gap:10px"></div>

              <button class="btn btn-secondary" onclick="toggleAllDetails()">Toggle All Details</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Failures Tab -->
      <div id="tab-failures" class="tab-content" style="display:none">
        <div class="card">
          <div class="card-header">
            <div class="card-title">⚠ Failures</div>
            <div style="font-size:12px;color:var(--text3)" id="failCount"></div>
          </div>
          <div class="card-body">
            <div id="failuresBody"></div>
          </div>
        </div>
      </div>

      <!-- Other tabs (simplified for brevity) -->
      <div id="tab-environments" class="tab-content" style="display:none">
        <div class="card">
          <div class="card-header"><div class="card-title">🌐 Environments</div></div>
          <div class="card-body" id="envBody"></div>
        </div>
      </div>
      <div id="tab-trends" class="tab-content" style="display:none">
        <div class="card">
          <div class="card-header"><div class="card-title">📈 Trends</div></div>
          <div class="card-body" id="trendsBody"></div>
        </div>
      </div>
      <div id="tab-compare" class="tab-content" style="display:none">
        <div class="card">
          <div class="card-header"><div class="card-title">⚖ Compare Releases</div></div>
          <div class="card-body" id="compareBody"></div>
        </div>
      </div>
      <div id="tab-labels" class="tab-content" style="display:none">
        <div class="card">
          <div class="card-header"><div class="card-title">🏷 Label Analytics</div></div>
          <div class="card-body" id="labelsBody"></div>
        </div>
      </div>
      <div id="tab-api" class="tab-content" style="display:none">
        <div class="card">
          <div class="card-header"><div class="card-title">🔒 API Setup</div></div>
          <div class="card-body">
            <div class="config-grid">
              <div class="config-group">
                <label>Auth Mode</label>
                <select class="input" id="authMode" onchange="toggleAuthFields()">
                  <option value="basic">Basic (Cloud)</option>
                  <option value="bearer">Bearer Token (Server)</option>
                  <option value="xray_cloud">Xray Cloud</option>
                </select>
              </div>
              <div class="config-group auth-basic">
                <label>Jira Email</label>
                <input class="input" id="authEmail" placeholder="you@company.com" />
              </div>
              <div class="config-group auth-basic">
                <label>Jira API Token</label>
                <input class="input" id="authToken" type="password" />
              </div>
              <div class="config-group auth-bearer" style="display:none">
                <label>Bearer Token</label>
                <input class="input" id="bearerToken" type="password" />
              </div>
              <div class="config-group auth-xray" style="display:none">
                <label>Xray Client ID</label>
                <input class="input" id="xrayClientId" />
              </div>
              <div class="config-group auth-xray" style="display:none">
                <label>Xray Client Secret</label>
                <input class="input" id="xrayClientSecret" type="password" />
              </div>
            </div>
            <button class="btn btn-primary" onclick="saveCredentials()">Save Credentials</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ========== STATE ==========
      const state = {
        testRuns: [],
        executions: [],
        fixVersion: "",
        sortField: "started",
        sortDir: 1,
        currentPage: 1,
        pageSize: 20,
        expandedAll: false,
      };

      // ========== UTILITIES ==========
      function escapeHtml(val) {
        if (val === null || val === undefined) return "";
        return String(val)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function fmt(dt) {
        if (!dt) return "—";
        return new Date(dt).toLocaleString('en-GB', {
          day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
        });
      }

      function dur(start, end) {
        if (!start || !end) return "—";
        const ms = new Date(end) - new Date(start);
        if (ms < 0) return "—";
        const s = Math.floor(ms / 1000);
        if (s < 60) return `${s}s`;
        return `${Math.floor(s / 60)}m ${s % 60}s`;
      }

      function statusClass(s) {
        s = (s || "").toUpperCase();
        if (s === "PASS" || s === "PASSED") return "pass";
        if (s === "FAIL" || s === "FAILED") return "fail";
        if (s === "SKIP" || s === "SKIPPED") return "skip";
        if (s === "BLOCKED") return "blocked";
        return "todo";
      }

      // ========== TABS ==========
      function switchTab(tabName, tabEl) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
        if (tabEl) tabEl.classList.add('active');
        const tab = document.getElementById('tab-' + tabName);
        if (tab) tab.style.display = 'block';
      }

      // ========== RAVEN STEP EVIDENCE (v16) ==========
      async function fetchRavenStepAttachments(jiraUrl, testRunId, stepId, headers) {
        const url = `${jiraUrl}/rest/raven/2.0/api/testrun/${testRunId}/step/${stepId}/attachment`;
        try {
          const res = await fetch(url, { headers });
          if (!res.ok) {
            console.warn(`Raven step attachment failed for ${testRunId}/${stepId}: ${res.status}`);
            return [];
          }
          return await res.json();
        } catch (e) {
          console.error(`Raven step attachment error for ${testRunId}/${stepId}:`, e);
          return [];
        }
      }

      async function fetchRavenStepDetails(jiraUrl, testRunId, stepId, headers) {
        const url = `${jiraUrl}/rest/raven/2.0/api/testrun/${testRunId}/step/${stepId}`;
        try {
          const res = await fetch(url, { headers });
          if (!res.ok) return null;
          return await res.json();
        } catch (e) {
          console.error(`Raven step details error for ${testRunId}/${stepId}:`, e);
          return null;
        }
      }

      // ========== RAVEN PAGINATION (Server/DC) ==========
      async function fetchRavenTestRunsPaginated(jiraUrl, execKey, creds) {
        let allRuns = [];
        let start = 0;
        const limit = 100;
        let hasMore = true;
        let pageCount = 0;
        const maxPages = 20;
        const headers = buildHeaders(creds);

        while (hasMore && pageCount < maxPages) {
          const url = `${jiraUrl}/rest/raven/2.0/api/testexec/${execKey}/test?detailed=true&start=${start}&limit=${limit}`;
          let res;
          try {
            res = await fetch(url, { headers });
          } catch (e) {
            console.error(`Raven fetch error for ${execKey}`, e);
            break;
          }
          if (!res.ok) break;
          const data = await res.json();
          if (!data || !data.length) break;

          // --- Fetch step evidence for each run (v16) ---
          for (const run of data) {
            if (!run.steps || !run.id) continue;
            for (const step of run.steps) {
              if (!step.id) continue;
              try {
                const attachments = await fetchRavenStepAttachments(jiraUrl, run.id, step.id, headers);
                step.evidence = attachments.map(a => ({
                  filename: a.fileName || a.filename || 'attachment',
                  downloadLink: `${jiraUrl}/rest/raven/2.0/api/testrun/${run.id}/step/${step.id}/attachment/${a.id}`,
                  storedInJira: true,
                  size: a.fileSize || 0
                }));
                // Rate limiting - avoid overwhelming server
                await new Promise(r => setTimeout(r, 100));
              } catch (e) {
                console.warn(`Failed to fetch evidence for step ${step.id}:`, e);
                step.evidence = [];
              }
            }
          }

          allRuns.push(...data);
          if (data.length < limit) hasMore = false;
          else {
            start += limit;
            pageCount++;
          }
        }

        const serverEnvField = document.getElementById("serverEnvField")?.value || "customfield_10028";
        const browserField = document.getElementById("browserField")?.value || "customfield_10029";

        return allRuns.map((run) => {
          let env = "", browser = "";
          if (run.testEnvironments && Array.isArray(run.testEnvironments)) {
            const nonBrowser = run.testEnvironments.filter(e => !/(chrome|firefox|safari|edge)/i.test(e));
            env = nonBrowser[0] || "";
            browser = run.testEnvironments.find(e => /(chrome|firefox|safari|edge)/i.test(e)) || "";
          }
          return {
            id: run.id || run.key,
            key: run.key || "",
            summary: run.summary || "",
            status: run.status || "TODO",
            assignee: run.assignee?.displayName || "",
            environment: env,
            browser: browser,
            started: run.startDate || null,
            finished: run.finishDate || null,
            error: run.comment || null,
            steps: (run.steps || []).map((s, i) => ({
              index: i + 1,
              action: s.step || "",
              expected: s.expectedResult || "",
              status: s.status || "TODO",
              comment: s.comment || "",
              evidence: s.evidence || [],
            })),
            evidence: [],
            labels: run.labels || [],
          };
        });
      }

      // ========== STUB FUNCTIONS (simplified for demo) ==========
      function buildHeaders(creds) {
        if (creds?.mode === 'basic') {
          return { 'Authorization': 'Basic ' + btoa(`${creds.email}:${creds.token}`) };
        }
        if (creds?.mode === 'bearer') {
          return { 'Authorization': `Bearer ${creds.bearerToken}` };
        }
        return {};
      }

      function triggerFetch() {
        // Simplified for demo - would normally fetch from Jira/Xray
        notify("Fetch started - demo mode", "info");
      }

      function startAutoFetch() {
        notify("Auto-fetch started - demo mode", "info");
      }

      function togglePauseFetch() {
        notify("Pause toggled - demo mode", "info");
      }

      function cancelFetch() {
        notify("Fetch cancelled - demo mode", "info");
      }

      function autoDetectRelease() {
        const fixVerInput = document.getElementById("fixVersion");
        fixVerInput.value = "Release 14.2 eBus";
        state.fixVersion = "Release 14.2 eBus";
        document.getElementById("topFixVersion").textContent = "fixVersion: Release 14.2 eBus";
        notify("Auto-detected active release: Release 14.2 eBus (demo)", "success");
      }

      function clearDateFilters() {
        document.getElementById("startDate").value = "";
        document.getElementById("endDate").value = "";
        notify("Date filters cleared", "info");
      }

      function clearFixVersion() {
        const fixVerInput = document.getElementById("fixVersion");
        fixVerInput.value = "";
        state.fixVersion = "";
        document.getElementById("topFixVersion").textContent = "fixVersion: —";
        notify("Fix Version cleared", "info");
      }

      function loadMockData() {
        notify("Demo data loaded - demo mode", "success");
      }

      function clearAllData() {
        state.testRuns = [];
        state.executions = [];
        document.getElementById("metricsGrid").innerHTML = "";
        document.getElementById("mainTableBody").innerHTML = "";
        notify("All data cleared", "info");
      }

      function clearExecFilters() {
        document.getElementById("execSearch").value = "";
        document.getElementById("statusFilter").value = "all";
        document.getElementById("envFilter").value = "all";
        document.getElementById("labelFilter").value = "all";
        renderMainTable();
        notify("Filters cleared", "info");
      }

      function sortTable(field) {
        if (state.sortField === field) {
          state.sortDir = -state.sortDir;
        } else {
          state.sortField = field;
          state.sortDir = 1;
        }
        renderMainTable();
      }

      function renderMainTable() {
        const tbody = document.getElementById("mainTableBody");
        tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">No tests match your filters (demo mode)</div></div></td></tr>';
      }

      function toggleAllDetails() {
        state.expandedAll = !state.expandedAll;
        notify("Toggle all details - demo mode", "info");
      }

      function toggleAuthFields() {
        const mode = document.getElementById("authMode").value;
        document.querySelectorAll('.auth-basic').forEach(el => el.style.display = mode === 'basic' ? 'block' : 'none');
        document.querySelectorAll('.auth-bearer').forEach(el => el.style.display = mode === 'bearer' ? 'block' : 'none');
        document.querySelectorAll('.auth-xray').forEach(el => el.style.display = mode === 'xray_cloud' ? 'block' : 'none');
      }

      function saveCredentials() {
        const creds = {
          mode: document.getElementById("authMode").value,
          email: document.getElementById("authEmail").value,
          token: document.getElementById("authToken").value,
          bearerToken: document.getElementById("bearerToken").value,
          xrayClientId: document.getElementById("xrayClientId").value,
          xrayClientSecret: document.getElementById("xrayClientSecret").value,
          hasAuth: true,
        };
        sessionStorage.setItem("xray_creds", JSON.stringify(creds));
        notify("Credentials saved", "success");
      }

      function notify(msg, type = "info") {
        alert(`${type.toUpperCase()}: ${msg}`);
      }

      function renderStepEvidence(evidence) {
        if (!evidence?.length) return '';
        return evidence.map(e => {
          const isImage = (e.filename || '').match(/\.(png|jpg|jpeg|gif|webp)$/i);
          if (isImage && e.downloadLink) {
            return `<img class="evidence-thumb" src="${escapeHtml(e.downloadLink)}" alt="${escapeHtml(e.filename)}" style="width:80px;height:60px;object-fit:cover;border:1px solid var(--border);border-radius:4px;cursor:pointer" onclick="window.open('${escapeHtml(e.downloadLink)}')" />`;
          }
          return `<a class="evidence-link" href="${escapeHtml(e.downloadLink || '#')}" target="_blank">📎 ${escapeHtml(e.filename)}</a>`;
        }).join('');
      }

      // ========== INIT ==========
      document.addEventListener("DOMContentLoaded", () => {
        toggleAuthFields();
        notify("Dashboard v16 loaded - Raven Step Evidence support added!", "success");
      });
    </script>
  </body>
</html>
